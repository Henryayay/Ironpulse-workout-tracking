<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>IronPulse — Performance &amp; Strength Tracker</title>
  <link rel="manifest" href="./manifest.json" />
  <meta name="theme-color" content="#0D0D0C" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="IronPulse" />
  <link rel="apple-touch-icon" href="./icons/icon-192.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png" />
  <link rel="icon" type="image/png" sizes="512x512" href="./icons/icon-512.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=DM+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            display: ['"Barlow Condensed"', 'sans-serif'],
            sans: ['"DM Sans"', 'system-ui', '-apple-system', 'sans-serif'],
            mono: ['"JetBrains Mono"', 'ui-monospace', 'SFMono-Regular', 'monospace'],
          },
          colors: {
            canvas: '#0D0D0C',
            surface: '#151513',
            elevated: '#1E1E1B',
            hairline: '#272724',
            steel: '#383833',
            chalk: '#F3F2ED',
            zincw: '#A8A69E',
            graphite: '#8A887F',
            vermilion: '#FF4F1F',
            vermilionHover: '#FF6438',
            brass: '#E5B53B',
            sage: '#7FB069',
            crimson: '#E5484D',
          }
        }
      }
    };
  </script>
  <style>
    :root {
      --bg-canvas: #0D0D0C;
      --bg-surface: #151513;
      --bg-elevated: #1E1E1B;
      --border-hairline: #272724;
      --border-strong: #383833;
      --ink-primary: #F3F2ED;
      --ink-secondary: #A8A69E;
      --ink-muted: #8A887F;
      --accent: #FF4F1F;
      --accent-hover: #FF6438;
      --accent-pr: #E5B53B;
      --status-complete: #7FB069;
      --status-danger: #E5484D;
      --ease-out-expo: cubic-bezier(0.22, 1, 0.36, 1);
      --ease-detent: cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    html, body {
      background-color: var(--bg-canvas);
      color: var(--ink-primary);
      font-family: 'DM Sans', system-ui, -apple-system, sans-serif;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }

    .font-display {
      font-family: 'Barlow Condensed', sans-serif;
    }
    .font-mono {
      font-family: 'JetBrains Mono', ui-monospace, monospace;
      font-variant-numeric: tabular-nums lining-nums;
    }
    .tabular-nums {
      font-variant-numeric: tabular-nums lining-nums;
    }

    /* Hairline & Surface Precision */
    .surface-band {
      background-color: var(--bg-surface);
      border: 1px solid var(--border-hairline);
    }

    /* Custom Scrollbar */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #0D0D0C; }
    ::-webkit-scrollbar-thumb { background: #2E2E2A; border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: #464640; }

    /* Live indicator subtle opacity pulse (no neon glow) */
    @keyframes subtlePulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.35; }
    }
    .live-dot {
      animation: subtlePulse 2s ease-in-out infinite;
    }

    /* 12-Week ISO Aligned Heatmap */
    .heatmap-shell {
      display: grid;
      grid-template-columns: 28px 1fr;
      grid-template-rows: auto 1fr;
      gap: 6px 8px;
      align-items: start;
      overflow-x: auto;
      padding-bottom: 4px;
    }
    .heatmap-weekdays {
      grid-column: 1;
      grid-row: 2;
      display: grid;
      grid-template-rows: repeat(7, 13px);
      gap: 4px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 9px;
      line-height: 13px;
      color: var(--ink-muted);
      text-align: right;
      padding-right: 4px;
    }
    .heatmap-weekdays span:nth-child(1) { grid-row: 1; }
    .heatmap-weekdays span:nth-child(2) { grid-row: 3; }
    .heatmap-weekdays span:nth-child(3) { grid-row: 5; }
    .heatmap-grid {
      grid-column: 2;
      grid-row: 2;
      display: grid;
      grid-auto-flow: column;
      grid-template-rows: repeat(7, 13px);
      grid-auto-columns: 13px;
      gap: 4px;
    }
    .hm-cell {
      width: 13px;
      height: 13px;
      border-radius: 2px;
      background: #1C1C19;
      box-shadow: inset 0 0 0 1px #272724;
      position: relative;
      transition: transform 140ms var(--ease-out-expo);
    }
    .hm-cell[data-level="1"] { background: #3D231C; box-shadow: inset 0 0 0 1px rgba(255, 79, 31, 0.18); }
    .hm-cell[data-level="2"] { background: #7A321F; box-shadow: none; }
    .hm-cell[data-level="3"] { background: #BA4020; box-shadow: none; }
    .hm-cell[data-level="4"] { background: #FF4F1F; box-shadow: none; }
    .hm-cell[data-pr="true"]::after {
      content: '';
      position: absolute;
      top: 2px;
      right: 2px;
      width: 3px;
      height: 3px;
      border-radius: 999px;
      background: #E5B53B;
    }
    .hm-cell.is-today {
      outline: 1.5px solid #F3F2ED;
      outline-offset: 1px;
    }
    .hm-cell:hover {
      transform: scale(1.22);
      z-index: 2;
    }

    /* Tactile Set Row & Check Detent */
    .set-row {
      border-left: 2px solid transparent;
      transition: background-color 180ms var(--ease-out-expo), border-color 180ms var(--ease-out-expo);
    }
    .set-row.is-completed {
      background-color: rgba(127, 176, 105, 0.06);
      border-left-color: var(--status-complete);
    }
    .set-row.is-active {
      background-color: rgba(255, 79, 31, 0.07);
      border-left-color: var(--accent);
    }
    .set-check-btn {
      transition: transform 140ms var(--ease-detent), background-color 150ms ease, border-color 150ms ease;
    }
    .set-check-btn:active {
      transform: scale(0.9);
    }

    /* PR Badge Metallic Sheen */
    .pr-stamp {
      position: relative;
      overflow: hidden;
      display: inline-flex;
      align-items: center;
      gap: 3px;
      padding: 2px 6px;
      border-radius: 2px;
      background: #E5B53B;
      color: #0D0D0C;
      font-family: 'JetBrains Mono', monospace;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      animation: prPop 260ms var(--ease-detent) both;
    }
    .pr-stamp::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(110deg, transparent 20%, rgba(255, 255, 255, 0.45) 50%, transparent 80%);
      transform: translateX(-130%);
      animation: prSheen 680ms var(--ease-out-expo) 120ms 1 forwards;
      pointer-events: none;
    }
    @keyframes prPop {
      0% { opacity: 0; transform: scale(0.84); }
      100% { opacity: 1; transform: scale(1); }
    }
    @keyframes prSheen {
      to { transform: translateX(130%); }
    }

    /* Rest Timer Linear Progress Bar */
    .timer-bar-track {
      height: 3px;
      width: 100%;
      background: #272724;
      overflow: hidden;
    }
    .timer-bar-fill {
      height: 100%;
      width: 100%;
      background: #FF4F1F;
      transform-origin: left center;
      transform: scaleX(var(--progress, 1));
      transition: transform 250ms linear, background-color 220ms ease;
    }
    .timer-bar-track.is-final .timer-bar-fill {
      background: #E5B53B;
    }

    @media (prefers-reduced-motion: reduce) {
      .live-dot, .hm-cell, .set-check-btn, .pr-stamp, .pr-stamp::after {
        animation: none !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>

      <!-- Telemetry Footer in Rail -->

            KG
          </button>
          <button type="button" data-action="open-tools-modal" title="Plate &amp; 1RM Calculator" class="h-9 rounded-[6px] bg-[#1E1E1B] border border-[#383833] hover:border-[#8A887F] text-[#A8A69E] hover:text-[#F3F2ED] flex items-center justify-center transition-colors">
            <i data-lucide="calculator" class="w-4 h-4"></i>

          <button type="button" data-action="toggle-sound" id="sound-toggle-btn" title="Toggle Audio Cues" class="h-9 rounded-[6px] bg-[#1E1E1B] border border-[#383833] hover:border-[#8A887F] text-[#F3F2ED] flex items-center justify-center transition-colors">

      </div>
    </aside>

    <!-- Mobile Top Bar (Opaque Matte, Zero Blur) -->

      <button type="button" data-action="nav" data-tab="dashboard" class="flex items-center gap-2 focus:outline-none">
        <div class="w-7 h-7 rounded-[4px] bg-[#FF4F1F] flex items-center justify-center">

      <div class="flex items-center gap-1.5">

        <button type="button" data-action="open-tools-modal" class="h-8 w-8 rounded-[6px] bg-[#1E1E1B] border border-[#383833] text-[#A8A69E] flex items-center justify-center"><i data-lucide="calculator" class="w-3.5 h-3.5"></i></button>
        <button type="button" data-action="toggle-sound" id="sound-toggle-btn-mobile" class="h-8 w-8 rounded-[6px] bg-[#1E1E1B] border border-[#383833] text-[#F3F2ED] flex items-center justify-center"><i data-lucide="volume-2" class="w-3.5 h-3.5"></i></button>

  <script>
  (function () {
    'use strict';

    // =========================================================================
    // STORAGE & CONSTANTS
    // =========================================================================
    const STORAGE_KEY = 'ironpulse_tracker_v2';
    const KG_TO_LB = 2.20462;
    const DAY_NAMES = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
    const FULL_DAYS = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
    const MON_FIRST_ORDER = [1, 2, 3, 4, 5, 6, 0];

    const MOTIVATION_QUOTES = [
      "Discipline is choosing what you want most over what you want right now.",
      "Every completed set is a vote for the stronger version of yourself.",
      "You don't need to feel motivated to start—starting creates the motivation.",
      "Small daily improvements over time lead to undeniable results.",
      "Consistency beats intensity when intensity isn't consistent.",
      "Your future self is watching right now—make them proud."
    ];

    const MUSCLE_COLOR_MAP = {

    // =========================================================================
    // SCHEDULE RESOLUTION HELPERS
    // =========================================================================
    function getISOWeekNumber(date) {
      const d = new Date(Date.UTC(date.getFullYear(), date.getMonth(), date.getDate()));
      const dayNum = d.getUTCDay() || 7;
      d.setUTCDate(d.getUTCDate() + 4 - dayNum);
      const yearStart = new Date(Date.UTC(d.getUTCFullYear(), 0, 1));
      return Math.ceil((((d - yearStart) / 86400000) + 1) / 7);
    }

    function getCurrentRotationSlot() {
      const weekNum = getISOWeekNumber(new Date());
      const isA = ((weekNum + (state.schedule.rotationOffset || 0)) % 2) === 1;
      return isA ? 'A' : 'B';
    }

    function getPlanById(planId) {
      return state.plans.find((p) => p.id === planId) || state.plans[0];
    }

    function getActivePlan() {
      return getPlanById(state.activePlanId);
    }

    function getScheduledWorkoutForToday() {
      const sched = state.schedule || { mode: 'single' };
      const todayDow = new Date().getDay();

      if (sched.mode === 'weekday') {
        const entry = sched.weekdayMap && sched.weekdayMap[todayDow];
        if (entry && entry.planId) {
          const plan = getPlanById(entry.planId);
          const dayIdx = Math.max(0, Math.min(plan.days.length - 1, entry.dayIndex || 0));
          return { isRestDay: false, modeLabel: `WEEKDAY MAP · ${FULL_DAYS[todayDow].toUpperCase()}`, plan, dayIndex: dayIdx, day: plan.days[dayIdx] };
        }
        for (let offset = 1; offset <= 7; offset++) {
          const dow = (todayDow + offset) % 7;
          const nextEntry = sched.weekdayMap && sched.weekdayMap[dow];
          if (nextEntry && nextEntry.planId) {
            const plan = getPlanById(nextEntry.planId);
            const dayIdx = Math.max(0, Math.min(plan.days.length - 1, nextEntry.dayIndex || 0));
            return { isRestDay: true, modeLabel: `REST DAY · NEXT ${FULL_DAYS[dow].toUpperCase()}`, plan, dayIndex: dayIdx, day: plan.days[dayIdx] };
          }
        }
      }

      if (sched.mode === 'alternating') {
        const slot = getCurrentRotationSlot();
        const plan = getPlanById(slot === 'A' ? sched.weekAPlanId : sched.weekBPlanId);
        const dayIdx = Math.max(0, Math.min(plan.days.length - 1, state.selectedDayIndex % Math.max(1, plan.days.length)));
        return { isRestDay: false, modeLabel: `WEEK ${slot} ROTATION`, plan, dayIndex: dayIdx, day: plan.days[dayIdx] };
      }

      const plan = getActivePlan();
      const dayIdx = Math.max(0, Math.min(plan.days.length - 1, state.selectedDayIndex % Math.max(1, plan.days.length)));
      return { isRestDay: false, modeLabel: 'ACTIVE SPLIT', plan, dayIndex: dayIdx, day: plan.days[dayIdx] };
    }

    // =========================================================================
    // AUDIO SYNTHESIS
    // =========================================================================
    function ensureAudio() {
      if (!state.soundEnabled) return null;
      try {
        if (!audioCtx) {
          const Ctx = window.AudioContext || window.webkitAudioContext;
          if (!Ctx) return null;
          audioCtx = new Ctx();
        }
        if (audioCtx.state === 'suspended') audioCtx.resume();
        return audioCtx;
      } catch (e) {
        return null;
      }
    }

    function playTone(freq, durationSec, type, gainVal, delaySec) {
      const ctx = ensureAudio();
      if (!ctx) return;
      try {
        const now = ctx.currentTime + (delaySec || 0);
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = type || 'sine';
        osc.frequency.setValueAtTime(freq, now);
        gain.gain.setValueAtTime(gainVal || 0.12, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + durationSec);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start(now);
        osc.stop(now + durationSec + 0.02);
      } catch (e) {}
    }

    // =========================================================================

    // =========================================================================
    function esc(str) {
      return String(str == null ? '' : str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function dispWeight(kg) {
      const val = Number(kg) || 0;
      if (state.unit === 'lb') return Math.round(val * KG_TO_LB * 10) / 10;
      return Math.round(val * 10) / 10;
    }

    function toKg(inputVal) {
      const val = Number(inputVal) || 0;
      if (state.unit === 'lb') return Math.round((val / KG_TO_LB) * 100) / 100;
      return Math.round(val * 100) / 100;
    }

    function formatVol(kg) {
      const v = dispWeight(kg);
      return v.toLocaleString(undefined, { maximumFractionDigits: 0 }) + ' ' + state.unit;
    }

    function formatExTarget(ex) {
      const mode = ex.mode || (ex.weightKg > 0 ? 'weight_reps' : 'bodyweight');
      if (mode === 'timed') {
        const wPart = ex.weightKg > 0 ? ` · ${dispWeight(ex.weightKg)} ${state.unit}` : '';
        return `${ex.sets} × ${ex.reps}s${wPart}`;
      }
      if (mode === 'bodyweight' || ex.weightKg <= 0) {
        return `${ex.sets} × ${ex.reps} · BW`;
      }
      return `${ex.sets} × ${ex.reps} · ${dispWeight(ex.weightKg)} ${state.unit}`;
    }

    function calcEpley1RM(weightKg, reps) {
      const w = Number(weightKg) || 0;
      const r = Number(reps) || 0;
      if (w <= 0 || r <= 0) return 0;
      if (r === 1) return w;
      return Math.round(w * (1 + r / 30) * 10) / 10;
    }

    function formatClock(totalSec) {
      const s = Math.max(0, Math.floor(totalSec || 0));
      const h = Math.floor(s / 3600);
      const m = Math.floor((s % 3600) / 60);
      const sec = s % 60;
      const pad = (n) => String(n).padStart(2, '0');
      return h > 0 ? `${pad(h)}:${pad(m)}:${pad(sec)}` : `${pad(m)}:${pad(sec)}`;
    }

    function getTotalLifetimeVolumeKg(s) {
      return (s.history || []).reduce((sum, h) => sum + (Number(h.totalVolumeKg) || 0), 0);
    }

    function getWorkoutsThisWeek(s) {
      const now = new Date();
      const startOfWeek = new Date(now);
      startOfWeek.setHours(0, 0, 0, 0);
      startOfWeek.setDate(now.getDate() - now.getDay());
      return (s.history || []).filter((h) => new Date(h.dateISO) >= startOfWeek).length;
    }

    function getStreakStats() {
      if (!state.history.length) return { current: 0, best: 0 };
      const uniqueDates = Array.from(new Set(state.history.map((h) => h.dateISO.slice(0, 10)))).sort();
      let best = 1;
      let run = 1;
      for (let i = 1; i < uniqueDates.length; i++) {
        const d1 = new Date(uniqueDates[i - 1] + 'T00:00:00');
        const d2 = new Date(uniqueDates[i] + 'T00:00:00');
        const diffDays = Math.round((d2 - d1) / 86400000);
        if (diffDays <= 3) {
          run++;
          if (run > best) best = run;
        } else {
          run = 1;
        }
      }
      const lastDate = new Date(uniqueDates[uniqueDates.length - 1] + 'T00:00:00');
      const today = new Date();
      today.setHours(0, 0, 0, 0);
      const daysSinceLast = Math.round((today - lastDate) / 86400000);
      return { current: daysSinceLast <= 3 ? run : 0, best };
    }

    function getXPStats() {
      const workoutXP = state.history.length * 150;
      const setXP = state.history.reduce((sum, h) => sum + (h.setsCompleted || 0) * 10, 0);
      const prXP = Object.keys(state.records).length * 75;
      const totalXP = workoutXP + setXP + prXP;
      const level = Math.floor(totalXP / 500) + 1;
      const xpInLevel = totalXP % 500;
      const tiers = ['Rookie', 'Grinder', 'Contender', 'Iron Athlete', 'Titan', 'Legend'];
      const tier = tiers[Math.min(tiers.length - 1, Math.floor((level - 1) / 2))];
      return { totalXP, level, xpInLevel, xpNeeded: 500, pct: Math.round((xpInLevel / 500) * 100), tier };
    }

    function getNextScheduledWorkoutDate() {
      const days = state.reminders.daysOfWeek || [];
      if (!days.length) return null;
      const [hh, mm] = (state.reminders.time || '18:00').split(':').map(Number);
      const now = new Date();
      for (let offset = 0; offset <= 7; offset++) {
        const candidate = new Date(now);
        candidate.setDate(now.getDate() + offset);
        candidate.setHours(hh || 18, mm || 0, 0, 0);
        if (days.includes(candidate.getDay()) && candidate.getTime() > now.getTime()) {
          return candidate;
        }
      }
      return null;
    }

    // =========================================================================
    function showToast(message, type) {
      const container = document.getElementById('toast-container');
      if (!container) return;
      const accents = {
        success: 'border-l-[#7FB069] text-[#F3F2ED]',
        pr: 'border-l-[#E5B53B] text-[#F3F2ED]',
        error: 'border-l-[#E5484D] text-[#F3F2ED]',
        info: 'border-l-[#FF4F1F] text-[#F3F2ED]'
      };
      const iconColors = {
        success: 'text-[#7FB069]',
        pr: 'text-[#E5B53B]',
        error: 'text-[#E5484D]',
        info: 'text-[#FF4F1F]'
      };
      const iconName = type === 'pr' ? 'trophy' : type === 'error' ? 'alert-circle' : type === 'success' ? 'check' : 'info';
      const el = document.createElement('div');
      el.className = `pointer-events-auto flex items-center gap-2.5 px-3.5 py-3 rounded-[6px] bg-[#1E1E1B] border border-[#383833] border-l-[3px] shadow-[0_12px_28px_rgba(0,0,0,0.65)] text-xs font-medium transition-all duration-200 ${accents[type] || accents.info}`;
      el.innerHTML = `<i data-lucide="${iconName}" class="w-4 h-4 shrink-0 ${iconColors[type] || iconColors.info}"></i><span>${esc(message)}</span>`;
      container.appendChild(el);
      if (window.lucide) window.lucide.createIcons();
      setTimeout(() => {
        el.style.opacity = '0';
        el.style.transform = 'translateY(6px)';
        setTimeout(() => el.remove(), 220);
      }, 3400);
    }

    function openModal(html) {
      const overlay = document.getElementById('modal-overlay');
      const box = document.getElementById('modal-box');
      if (!overlay || !box) return;
      box.innerHTML = html;
      overlay.classList.remove('hidden');
      if (window.lucide) window.lucide.createIcons();
    }

    function closeModal() {
      const overlay = document.getElementById('modal-overlay');
      if (overlay) overlay.classList.add('hidden');
    }

    function copyTextToClipboard(text, label) {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(() => {
          showToast(`${label || 'Text'} copied to clipboard`, 'success');
        }).catch(() => fallbackCopy(text, label));
      } else {
        fallbackCopy(text, label);
      }
    }

    function fallbackCopy(text, label) {
      try {
        const ta = document.createElement('textarea');
        ta.value = text;
        ta.style.position = 'fixed';
        ta.style.opacity = '0';
        document.body.appendChild(ta);
        ta.focus();
        ta.select();
        document.execCommand('copy');
        ta.remove();
        showToast(`${label || 'Text'} copied to clipboard`, 'success');
      } catch (e) {
        showToast('Could not copy automatically. Select and copy manually.', 'error');
      }
    }

    function downloadFile(filename, content, mimeType) {
      const blob = new Blob([content], { type: mimeType || 'text/plain;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
    }

    // =========================================================================
    // CLOCK, LIVE COUNTDOWN & ON-TIME REMINDER ENGINE
    // =========================================================================
    function startClockLoop() {
      if (clockInterval) clearInterval(clockInterval);
      updateClockUI();
      clockInterval = setInterval(updateClockUI, 1000);
    }

    function updateClockUI() {
      const nextDate = getNextScheduledWorkoutDate();
      const headerText = document.getElementById('header-countdown-text');
      const dashCountdown = document.getElementById('dash-next-countdown');
      const nowMs = Date.now();

      if (!nextDate || !state.reminders.enabled) {
        const txt = state.reminders.enabled ? 'UNSET' : 'PAUSED';
        if (headerText) headerText.textContent = txt;
        if (dashCountdown) dashCountdown.textContent = txt;
        return;
      }

      const diffSec = Math.max(0, Math.floor((nextDate.getTime() - nowMs) / 1000));
      const d = Math.floor(diffSec / 86400);
      const h = Math.floor((diffSec % 86400) / 3600);
      const m = Math.floor((diffSec % 3600) / 60);
      const s = diffSec % 60;
      const pad = (n) => String(n).padStart(2, '0');
      const formatted = d > 0 ? `${d}d ${pad(h)}h ${pad(m)}m` : `${pad(h)}:${pad(m)}:${pad(s)}`;

      if (headerText) headerText.textContent = formatted;
      if (dashCountdown) dashCountdown.textContent = formatted;

      if (state.reminders.snoozeUntilMs && nowMs >= state.reminders.snoozeUntilMs) {
        state.reminders.snoozeUntilMs = 0;
        saveState();
        triggerReminderAlert('Snooze Complete — Time to Train', 'Your snoozed reminder is up. Step up to the bar.');
      }

      const now = new Date();
      const todayDow = now.getDay();
      if (state.reminders.daysOfWeek.includes(todayDow) && !state.activeSession) {
        const [rh, rm] = (state.reminders.time || '18:00').split(':').map(Number);
        const target = new Date(now);
        target.setHours(rh || 18, rm || 0, 0, 0);
        const leadMs = (Number(state.reminders.leadMinutes) || 0) * 60000;
        const triggerMs = target.getTime() - leadMs;
        const triggerKey = `${now.toISOString().slice(0, 10)}_${state.reminders.time}_${state.reminders.leadMinutes}`;

        if (nowMs >= triggerMs && nowMs <= target.getTime() + 60000 && state.reminders.lastTriggeredKey !== triggerKey) {
          state.reminders.lastTriggeredKey = triggerKey;
          saveState();
          const sched = getScheduledWorkoutForToday();
          const label = leadMs > 0
            ? `Session in ${state.reminders.leadMinutes} min (${state.reminders.time})`
            : `${state.reminders.time} — Training Time`;
          triggerReminderAlert(label, `${sched.day ? sched.day.name : 'Scheduled Workout'} · ${sched.plan.name}`);
        }
      }
    }

    function triggerReminderAlert(title, subtitle) {
      const banner = document.getElementById('reminder-banner');
      const tEl = document.getElementById('reminder-banner-title');
      const sEl = document.getElementById('reminder-banner-sub');
      if (tEl) tEl.textContent = title;
      if (sEl) sEl.textContent = subtitle;
      if (banner) banner.classList.remove('hidden');
      playReminderChime();
      if (window.lucide) window.lucide.createIcons();

      try {
        if ('Notification' in window && Notification.permission === 'granted') {
          new Notification(title, { body: subtitle });
        }
      } catch (e) {}
    }

    // =========================================================================
    // REST TIMER & SESSION TIMER
    // =========================================================================
    function updateRestProgressVisual() {
      const disp = document.getElementById('rest-timer-display');
      const track = document.getElementById('rest-timer-progress-track');
      if (disp) disp.textContent = formatClock(restSecondsLeft);
      if (track) {
        const ratio = restTotalSeconds > 0 ? Math.max(0, Math.min(1, restSecondsLeft / restTotalSeconds)) : 0;
        track.style.setProperty('--progress', ratio.toFixed(4));
        track.classList.toggle('is-final', restSecondsLeft <= 10);
      }
    }

    function startRestTimer(seconds) {
      if (restInterval) clearInterval(restInterval);
      restSecondsLeft = Math.max(5, Math.floor(seconds || 90));
      restTotalSeconds = restSecondsLeft;
      const bar = document.getElementById('rest-timer-bar');
      if (bar) bar.classList.remove('hidden');
      updateRestProgressVisual();

      restInterval = setInterval(() => {
        restSecondsLeft--;
        if (restSecondsLeft <= 3 && restSecondsLeft > 0) {
          playTone(520, 0.08, 'sine', 0.1, 0);
        }
        if (restSecondsLeft <= 0) {
          clearInterval(restInterval);
          restInterval = null;
          if (bar) bar.classList.add('hidden');
          playRestDoneSound();
          showToast('Rest complete — next set up', 'info');
        } else {
          updateRestProgressVisual();
        }
      }, 1000);
    }

    function stopRestTimer() {
      if (restInterval) clearInterval(restInterval);
      restInterval = null;
      restSecondsLeft = 0;
      const bar = document.getElementById('rest-timer-bar');
      if (bar) bar.classList.add('hidden');
    }

    function startSessionTimer() {
      if (sessionInterval) clearInterval(sessionInterval);
      sessionInterval = setInterval(() => {
        if (!state.activeSession || state.activeSession.isPaused) return;
        state.activeSession.elapsedSec = (state.activeSession.elapsedSec || 0) + 1;
        const el = document.getElementById('live-session-timer');
        if (el) el.textContent = formatClock(state.activeSession.elapsedSec);
      }, 1000);
    }

    function stopSessionTimer() {
      if (sessionInterval) clearInterval(sessionInterval);
      sessionInterval = null;
    }

    // =========================================================================
    // WORKOUT SESSION LOGIC
    // =========================================================================
    function startWorkoutSession(dayIndex, explicitPlanId) {
      const plan = explicitPlanId ? getPlanById(explicitPlanId) : getActivePlan();
      if (!plan || !plan.days.length) {
        showToast('Create or select a workout plan with at least one day.', 'error');
        return;
      }
      const idx = Math.max(0, Math.min(plan.days.length - 1, dayIndex != null ? dayIndex : state.selectedDayIndex));
      state.selectedDayIndex = idx;
      const day = plan.days[idx];

      state.activeSession = {
        planId: plan.id,
        planName: plan.name,
        dayId: day.id,
        dayName: day.name,
        startedAtMs: Date.now(),
        elapsedSec: 0,
        isPaused: false,
        exercises: day.exercises.map((ex) => {
          const sets = [];
          const count = Math.max(1, Number(ex.sets) || 3);
          for (let i = 0; i < count; i++) {
            sets.push({
              id: `${ex.id}_s_${i}_${Date.now()}`,
              weightKg: Number(ex.weightKg) || 0,
              reps: Number(ex.reps) || 10,
              done: false,
              isPR: false
            });
          }
          return {
            id: ex.id,
            name: ex.name,
            muscle: ex.muscle || 'Full Body',
            mode: ex.mode || (ex.weightKg > 0 ? 'weight_reps' : 'bodyweight'),
            restSec: Number(ex.restSec) || 90,
            notes: ex.notes || '',
            sets
          };
        })
      };
      state.activeTab = 'workout';
      saveState();
      startSessionTimer();
      render();
      showToast(`Session live: ${day.name}`, 'info');
    }

    function toggleSetDone(exIdx, setIdx) {
      if (!state.activeSession) return;
      const ex = state.activeSession.exercises[exIdx];
      if (!ex || !ex.sets[setIdx]) return;
      const s = ex.sets[setIdx];
      s.done = !s.done;

      if (s.done) {
        const est1RM = calcEpley1RM(s.weightKg, s.reps);
        const existingRec = state.records[ex.name];
        const prevBest1RM = existingRec ? existingRec.best1RMKg : 0;
        const prevBestW = existingRec ? existingRec.bestWeightKg : 0;

        if (s.weightKg > 0 && (est1RM > prevBest1RM || s.weightKg > prevBestW)) {
          s.isPR = true;
          playPRSound();
          showToast(`NEW PR · ${ex.name} ${dispWeight(s.weightKg)} ${state.unit} × ${s.reps}`, 'pr');
          if (typeof window.confetti === 'function') {
            window.confetti({ particleCount: 40, spread: 55, colors: ['#FF4F1F', '#E5B53B', '#F3F2ED'], origin: { y: 0.72 } });
          }
        } else {
          s.isPR = false;
          playSetCompleteSound();
        }

        if (state.autoRestTimer && ex.restSec > 0) {
          startRestTimer(ex.restSec);
        }
      } else {
        s.isPR = false;
      }

      saveState();
      render();
    }

    function commitFinishedWorkout() {
      if (!state.activeSession) return;
      const rpeEl = document.getElementById('finish-rpe-input');
      const notesEl = document.getElementById('finish-notes-input');
      const rpe = rpeEl ? Number(rpeEl.value) : 8;
      const notes = notesEl ? notesEl.value.trim() : '';
      const nowISO = new Date().toISOString();

      let totalVolumeKg = 0;
      let setsCompleted = 0;
      let prsCount = 0;

      const loggedExercises = state.activeSession.exercises.map((ex) => {
        const doneSets = ex.sets.filter((s) => s.done);
        doneSets.forEach((s) => {
          setsCompleted++;
          totalVolumeKg += (Number(s.weightKg) || 0) * (Number(s.reps) || 0);
          const est1RM = calcEpley1RM(s.weightKg, s.reps);
          const prev = state.records[ex.name];
          if (s.weightKg > 0 && (!prev || est1RM > prev.best1RMKg || s.weightKg > prev.bestWeightKg)) {
            prsCount++;
            state.records[ex.name] = {
              bestWeightKg: Math.max(prev ? prev.bestWeightKg : 0, Number(s.weightKg)),
              bestReps: Number(s.reps),
              best1RMKg: Math.max(prev ? prev.best1RMKg : 0, est1RM),
              dateISO: nowISO
            };
          }
        });
        return {
          name: ex.name,
          muscle: ex.muscle,
          sets: doneSets.map((s) => ({ weightKg: s.weightKg, reps: s.reps, isPR: s.isPR }))
        };
      });

      state.history.unshift({
        id: 'hist_' + Date.now(),
        dateISO: nowISO,
        planName: state.activeSession.planName,
        dayName: state.activeSession.dayName,
        durationSec: Math.max(60, state.activeSession.elapsedSec || 0),
        totalVolumeKg: Math.round(totalVolumeKg),
        setsCompleted,
        prsCount,
        rpe,
        notes,
        exercises: loggedExercises
      });

      const plan = getPlanById(state.activeSession.planId);
      if (plan && plan.days.length > 1) {
        state.selectedDayIndex = (state.selectedDayIndex + 1) % plan.days.length;
      }

      state.activeSession = null;
      stopSessionTimer();
      stopRestTimer();
      saveState();
      closeModal();
      state.activeTab = 'dashboard';
      render();

      playPRSound();
      if (typeof window.confetti === 'function') {
        window.confetti({ particleCount: 70, spread: 70, colors: ['#FF4F1F', '#E5B53B', '#F3F2ED'], origin: { y: 0.65 } });
      }
      showToast(`Workout logged · +${150 + setsCompleted * 10} XP`, 'success');
    }

    // =========================================================================
    // CUSTOM PLAN IMPORT PARSER
    // =========================================================================
    function parseCustomPlan(rawText, customPlanName) {
      const text = (rawText || '').trim();
      if (!text) throw new Error('Input is empty. Paste JSON, CSV, or upload a plan file.');

      if (text.startsWith('{') || text.startsWith('[')) {
        let data;
        try {
          data = JSON.parse(text);
        } catch (e) {
          throw new Error('Invalid JSON syntax: ' + e.message);
        }
        const planName = customPlanName || (data.name ? String(data.name) : 'Imported Custom Plan');
        let days = [];
        if (Array.isArray(data)) {
          days = (data.length && data[0].exercises) ? data : [{ name: 'Day 1', exercises: data }];
        } else if (Array.isArray(data.days)) {
          days = data.days;
        } else if (Array.isArray(data.exercises)) {
          days = [{ name: data.dayName || 'Day 1', exercises: data.exercises }];
        } else {
          throw new Error('JSON must contain a "days" array or an "exercises" array.');
        }

        const normalizedDays = days.map((d, di) => ({
          id: 'imp_day_' + Date.now() + '_' + di,
          name: String(d.name || `Day ${di + 1}`),
          exercises: (d.exercises || []).map((ex, ei) => ({
            id: 'imp_ex_' + Date.now() + '_' + di + '_' + ei,
            name: String(ex.name || `Exercise ${ei + 1}`),
            muscle: String(ex.muscle || 'Full Body'),
            mode: ex.mode || (Number(ex.weightKg != null ? ex.weightKg : ex.weight) > 0 ? 'weight_reps' : 'bodyweight'),
            sets: Math.max(1, Number(ex.sets) || 3),
            reps: Math.max(1, Number(ex.reps) || 10),
            weightKg: Math.max(0, Number(ex.weightKg != null ? ex.weightKg : ex.weight) || 0),
            restSec: Math.max(15, Number(ex.restSec != null ? ex.restSec : ex.rest) || 90),
            notes: String(ex.notes || '')
          }))
        })).filter((d) => d.exercises.length > 0);

        if (!normalizedDays.length) throw new Error('No exercises found in JSON plan.');
        return { id: 'plan_' + Date.now(), name: planName, description: data.description || 'Custom imported workout plan', days: normalizedDays };
      }

      const lines = text.split(/\r?\n/).map((l) => l.trim()).filter(Boolean);
      if (!lines.length) throw new Error('No lines found to parse.');

      const dayMap = new Map();
      let startIdx = (/^day[,\t|]/i.test(lines[0]) || /^exercise[,\t|]/i.test(lines[0])) ? 1 : 0;

      for (let i = startIdx; i < lines.length; i++) {
        const line = lines[i];
        const delimiter = line.includes('|') ? '|' : line.includes('\t') ? '\t' : ',';
        const cols = line.split(delimiter).map((c) => c.trim());

        let dayName = 'Day 1', exName = '', muscle = 'Full Body', sets = 3, reps = 10, weightKg = 0, restSec = 90;
        if (cols.length >= 6) {
          dayName = cols[0] || 'Day 1';
          exName = cols[1];
          muscle = cols[2] || 'Full Body';
          sets = parseInt(cols[3], 10) || 3;
          reps = parseInt(cols[4], 10) || 10;
          weightKg = parseFloat(cols[5]) || 0;
          restSec = parseInt(cols[6], 10) || 90;
        } else if (cols.length >= 3) {
          exName = cols[0];
          const srMatch = cols[1].match(/(\d+)\s*[xX×]\s*(\d+)/);
          if (srMatch) { sets = parseInt(srMatch[1], 10); reps = parseInt(srMatch[2], 10); }
          else { sets = parseInt(cols[1], 10) || 3; reps = parseInt(cols[2], 10) || 10; }
          weightKg = parseFloat((cols[2] || '0').replace(/[^\d.]/g, '')) || 0;
          if (cols[3]) restSec = parseInt(cols[3].replace(/[^\d]/g, ''), 10) || 90;
        } else {
          exName = cols[0];
        }

        if (!exName) continue;
        if (!dayMap.has(dayName)) dayMap.set(dayName, []);
        dayMap.get(dayName).push({
          id: 'csv_ex_' + Date.now() + '_' + i,
          name: exName, muscle, mode: weightKg > 0 ? 'weight_reps' : 'bodyweight',
          sets, reps, weightKg, restSec, notes: ''
        });
      }

      if (dayMap.size === 0) throw new Error('Could not parse exercises. Use CSV (Day,Exercise,Muscle,Sets,Reps,Weight,RestSec) or JSON.');
      const days = Array.from(dayMap.entries()).map(([dName, exList], idx) => ({ id: 'csv_day_' + Date.now() + '_' + idx, name: dName, exercises: exList }));
      return {
        id: 'plan_' + Date.now(),
        name: customPlanName || 'Imported Custom Plan',
        description: `Imported ${days.length} training day(s) with ${days.reduce((a, d) => a + d.exercises.length, 0)} exercises.`,
        days
      };
    }

    // =========================================================================
    // DEMO HISTORY LOADER
    // =========================================================================
    function loadSampleHistory() {
      const now = new Date();
      const samples = [];
      const exercisesMeta = [
        { name: 'Barbell Bench Press', muscle: 'Chest', baseW: 62.5 },
        { name: 'Barbell Back Squat', muscle: 'Legs', baseW: 80 },
        { name: 'Barbell Bent-Over Row', muscle: 'Back', baseW: 57.5 },
        { name: 'Overhead Dumbbell Press', muscle: 'Shoulders', baseW: 18 },
        { name: 'Romanian Deadlift', muscle: 'Legs', baseW: 67.5 }
      ];

      for (let i = 10; i >= 1; i--) {
        const dt = new Date(now);
        dt.setDate(now.getDate() - i * 3);
        const progressBump = (10 - i) * 1.25;
        const dayType = i % 3 === 0 ? 'Push Day' : i % 3 === 1 ? 'Pull Day' : 'Leg Day';
        const picked = dayType === 'Push Day' ? [exercisesMeta[0], exercisesMeta[3]] : dayType === 'Pull Day' ? [exercisesMeta[2], exercisesMeta[4]] : [exercisesMeta[1], exercisesMeta[4]];

        let vol = 0, setsCnt = 0;
        const exList = picked.map((em) => {
          const w = Math.round((em.baseW + progressBump) * 2) / 2;
          const sets = [
            { weightKg: w, reps: 8, isPR: false },
            { weightKg: w, reps: 8, isPR: false },
            { weightKg: w + 2.5, reps: 6, isPR: i === 1 }
          ];
          sets.forEach((s) => {
            setsCnt++;
            vol += s.weightKg * s.reps;
            const e1rm = calcEpley1RM(s.weightKg, s.reps);
            const prev = state.records[em.name];
            if (!prev || e1rm > prev.best1RMKg) {
              state.records[em.name] = {
                bestWeightKg: Math.max(prev ? prev.bestWeightKg : 0, s.weightKg),
                bestReps: s.reps,
                best1RMKg: e1rm,
                dateISO: dt.toISOString()
              };
            }
          });
          return { name: em.name, muscle: em.muscle, sets };
        });

        samples.unshift({
          id: 'demo_' + i + '_' + Date.now(),
          dateISO: dt.toISOString(),
          planName: 'Push / Pull / Legs + Core (4-Day)',
          dayName: dayType,
          durationSec: 2700 + i * 95,
          totalVolumeKg: Math.round(vol),
          setsCompleted: setsCnt,
          prsCount: i === 1 ? 2 : i === 4 ? 1 : 0,
          rpe: 7 + (i % 3),
          notes: 'Sample progressive overload session',
          exercises: exList
        });
      }

      state.history = [...samples, ...state.history];
      if (!state.bodyWeights.length) {
        for (let w = 5; w >= 0; w--) {
          const d = new Date(now);
          d.setDate(now.getDate() - w * 7);
          state.bodyWeights.push({ dateISO: d.toISOString(), weightKg: Math.round((76.5 - (5 - w) * 0.3) * 10) / 10 });
        }
      }
      saveState();
      render();
      showToast('Loaded 4 weeks of sample training history', 'success');
    }

    // =========================================================================
    // CALENDAR .ICS EXPORT
    // =========================================================================
    function exportReminderICS() {
      const days = state.reminders.daysOfWeek || [];
      if (!days.length) {
        showToast('Select at least one workout day before exporting.', 'error');
        return;
      }
      const icsDays = ['SU', 'MO', 'TU', 'WE', 'TH', 'FR', 'SA'];
      const byDay = days.map((d) => icsDays[d]).join(',');
      const [hh, mm] = (state.reminders.time || '18:00').split(':');
      const now = new Date();
      const pad = (n) => String(n).padStart(2, '0');
      const ymd = `${now.getFullYear()}${pad(now.getMonth() + 1)}${pad(now.getDate())}`;
      const startTime = `${ymd}T${pad(hh)}${pad(mm)}00`;
      const endTime = `${ymd}T${pad((parseInt(hh, 10) + 1) % 24)}${pad(mm)}00`;
      const plan = getActivePlan();

      const ics = [
        'BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//IronPulse//Workout Reminder//EN', 'BEGIN:VEVENT',
        `UID:ironpulse-${Date.now()}@ironpulse.app`, `DTSTART:${startTime}`, `DTEND:${endTime}`,
        `RRULE:FREQ=WEEKLY;BYDAY=${byDay}`, `SUMMARY:IronPulse Workout — ${plan ? plan.name : 'Training Session'}`,
        'DESCRIPTION:Scheduled workout session. Stay consistent and beat your records.',
        'BEGIN:VALARM', `TRIGGER:-PT${state.reminders.leadMinutes || 15}M`, 'ACTION:DISPLAY', 'DESCRIPTION:Workout starts soon!', 'END:VALARM',
        'END:VEVENT', 'END:VCALENDAR'
      ].join('\r\n');

      downloadFile('ironpulse-workout-schedule.ics', ics, 'text/calendar;charset=utf-8');
      showToast('Calendar reminder (.ics) downloaded', 'success');
    }

        state.history.forEach((h) => {
          (h.exercises || []).forEach((ex) => {
            counts[ex.muscle || 'Other'] = (counts[ex.muscle || 'Other'] || 0) + (ex.sets ? ex.sets.length : 0);
          });
        });
      } else if (state.schedule && state.schedule.mode === 'weekday') {
        Object.values(state.schedule.weekdayMap || {}).forEach((entry) => {
          if (!entry || !entry.planId) return;
          const p = getPlanById(entry.planId);
          const d = p && p.days[entry.dayIndex];
          if (d) {
            d.exercises.forEach((ex) => {
              counts[ex.muscle || 'Other'] = (counts[ex.muscle || 'Other'] || 0) + (Number(ex.sets) || 0);
            });
          }
        });
      } else {
        const sched = getScheduledWorkoutForToday();
        const plan = sched.plan;
        if (plan) {
          plan.days.forEach((d) => {
            d.exercises.forEach((ex) => {
              counts[ex.muscle || 'Other'] = (counts[ex.muscle || 'Other'] || 0) + (Number(ex.sets) || 0);
            });
          });
        }
      }
      const labels = Object.keys(counts);
      const data = Object.values(counts);
      if (!labels.length) return;

      const sliceColors = labels.map((lbl, idx) => MUSCLE_COLOR_MAP[lbl] || MUSCLE_FALLBACK_COLORS[idx % MUSCLE_FALLBACK_COLORS.length]);

      const centerReadoutPlugin = {
        id: 'centerReadout',
        afterDraw(chart) {
          const { ctx, chartArea } = chart;
          if (!chartArea) return;
          const cx = (chartArea.left + chartArea.right) / 2;
          const cy = (chartArea.top + chartArea.bottom) / 2;
          const ds = chart.data.datasets[0].data;
          const lbls = chart.data.labels;
          const total = ds.reduce((acc, v, i) => (chart.getDataVisibility(i) ? acc + v : acc), 0);
          const active = chart.getActiveElements();

          let primaryText = String(total);
          let secondaryText = 'TOTAL SETS';
          if (active.length > 0) {
            const idx = active[0].index;
            const val = ds[idx];
            const pct = total ? Math.round((val / total) * 100) : 0;
            primaryText = String(val);
            secondaryText = `${lbls[idx].toUpperCase()} · ${pct}%`;
          }

          ctx.save();
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.font = '700 32px "Barlow Condensed", sans-serif';
          ctx.fillStyle = '#F3F2ED';
          ctx.fillText(primaryText, cx, cy - 6);
          ctx.font = '600 9px "JetBrains Mono", monospace';
          ctx.fillStyle = '#8A887F';
          ctx.fillText(secondaryText, cx, cy + 16);
          ctx.restore();
        }
      };

      charts.muscle = new Chart(canvas, {
        type: 'doughnut',
        data: {
          labels,
          datasets: [{
            data,
            backgroundColor: sliceColors,
            borderColor: '#151513',
            borderWidth: 3,
            borderRadius: 3,
            spacing: 2,
            hoverOffset: 5
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          cutout: '76%',
          animation: { duration: 380 },
          plugins: {
            legend: { display: false },
            tooltip: { enabled: false }
          }
        },
        plugins: [centerReadoutPlugin]
      });

      // Render interactive 2-column HTML legend
      const legendEl = document.getElementById('dash-muscle-legend');
      if (legendEl) {
        legendEl.innerHTML = labels.map((lbl, idx) => `
          <button type="button" data-legend-idx="${idx}" class="flex items-center justify-between gap-2 text-left py-0.5 hover:text-[#F3F2ED] transition-opacity">
            <span class="flex items-center gap-2 min-w-0">
              <span class="w-2.5 h-2.5 rounded-[2px] shrink-0" style="background:${sliceColors[idx]}"></span>
              <span class="text-xs text-[#A8A69E] truncate">${esc(lbl)}</span>
            </span>
            <span class="font-mono text-xs font-semibold text-[#F3F2ED] tabular-nums">${data[idx]}</span>
          </button>
        `).join('');

        legendEl.querySelectorAll('[data-legend-idx]').forEach((btn) => {
          btn.addEventListener('click', () => {
            const idx = parseInt(btn.dataset.legendIdx, 10);
            if (!charts.muscle) return;
            charts.muscle.toggleDataVisibility(idx);
            charts.muscle.update();
            btn.style.opacity = charts.muscle.getDataVisibility(idx) ? '1' : '0.35';
          });
        });
      }
    }

    function initProgressCharts() {
      if (typeof Chart === 'undefined') return;

      const sharedTooltip = {
        backgroundColor: '#1E1E1B',
        borderColor: '#383833',
        borderWidth: 1,
        cornerRadius: 6,
        padding: 10,
        titleColor: '#A8A69E',
        bodyColor: '#F3F2ED',
        bodyFont: { family: '"JetBrains Mono", monospace', size: 12, weight: '600' },
        displayColors: false
      };

      const sharedScales = (fmt) => ({
        x: {
          border: { display: false },
          grid: { display: false },
          ticks: { color: '#8A887F', font: { family: '"JetBrains Mono", monospace', size: 10 } }
        },
        y: {
          border: { display: false, dash: [3, 4] },
          grid: { color: 'rgba(243, 242, 237, 0.07)', drawTicks: false },
          ticks: { color: '#8A887F', font: { family: '"JetBrains Mono", monospace', size: 10 }, maxTicksLimit: 5, callback: fmt }
        }
      });

      const volCanvas = document.getElementById('progress-volume-chart');
      if (volCanvas && state.history.length) {
        const recent = [...state.history].slice(0, 12).reverse();
        charts.volume = new Chart(volCanvas, {
          type: 'bar',
          data: {
            labels: recent.map((h) => h.dateISO.slice(5, 10)),
            datasets: [{
              label: `Volume (${state.unit})`,
              data: recent.map((h) => dispWeight(h.totalVolumeKg)),
              backgroundColor: (ctx) => (ctx.dataIndex === ctx.dataset.data.length - 1 ? '#FF4F1F' : '#2C2C28'),
              hoverBackgroundColor: (ctx) => (ctx.dataIndex === ctx.dataset.data.length - 1 ? '#FF6438' : '#3E3E38'),
              borderRadius: { topLeft: 3, topRight: 3, bottomLeft: 0, bottomRight: 0 },
              maxBarThickness: 28
            }]
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: { legend: { display: false }, tooltip: sharedTooltip },
            scales: sharedScales((v) => (v >= 1000 ? `${(v / 1000).toFixed(1)}k` : v))
          }
        });
      }

      const strCanvas = document.getElementById('progress-strength-chart');
      const selEx = state.selectedProgressExercise;
      if (strCanvas && selEx) {
        const pts = [];
        [...state.history].reverse().forEach((h) => {
          const match = (h.exercises || []).find((e) => e.name === selEx);
          if (match && match.sets && match.sets.length) {
            const max1RM = Math.max(...match.sets.map((s) => calcEpley1RM(s.weightKg, s.reps)));
            if (max1RM > 0) pts.push({ x: h.dateISO.slice(5, 10), y: dispWeight(max1RM) });
          }
        });
        if (pts.length) {
          charts.strength = new Chart(strCanvas, {
            type: 'line',
            data: {
              labels: pts.map((p) => p.x),
              datasets: [{
                label: `Est. 1RM (${state.unit})`,
                data: pts.map((p) => p.y),
                borderColor: '#FF4F1F',
                borderWidth: 2,
                tension: 0.3,
                fill: true,
                backgroundColor: ({ chart }) => {
                  const { ctx, chartArea } = chart;
                  if (!chartArea) return 'rgba(255, 79, 31, 0.14)';
                  const g = ctx.createLinearGradient(0, chartArea.top, 0, chartArea.bottom);
                  g.addColorStop(0, 'rgba(255, 79, 31, 0.24)');
                  g.addColorStop(1, 'rgba(255, 79, 31, 0.0)');
                  return g;
                },
                pointRadius: 3.5,
                pointBackgroundColor: '#E5B53B',
                pointBorderColor: '#0D0D0C',
                pointBorderWidth: 1.5
              }]
            },
            options: {
              responsive: true,
              maintainAspectRatio: false,
              plugins: { legend: { display: false }, tooltip: sharedTooltip },
              scales: sharedScales((v) => `${v}${state.unit}`)
            }
          });
        }
      }

      const bwCanvas = document.getElementById('progress-bw-chart');
      if (bwCanvas && state.bodyWeights.length) {
        const recentBW = state.bodyWeights.slice(-12);
        charts.bodyWeight = new Chart(bwCanvas, {
          type: 'line',
          data: {
            labels: recentBW.map((b) => b.dateISO.slice(5, 10)),
            datasets: [{
              label: state.unit,
              data: recentBW.map((b) => dispWeight(b.weightKg)),
              borderColor: '#E5B53B',
              backgroundColor: 'rgba(229, 181, 59, 0.12)',
              borderWidth: 2,
              fill: true,
              tension: 0.3,
              pointRadius: 3,
              pointBackgroundColor: '#E5B53B'
            }]
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: { legend: { display: false }, tooltip: sharedTooltip },
            scales: sharedScales((v) => `${v}`)
          }
        });
      }

      const selEl = document.getElementById('progress-ex-select');
      if (selEl) {
        selEl.addEventListener('change', () => {
          state.selectedProgressExercise = selEl.value;
          saveState();
          render();
        });
      }
      const searchEl = document.getElementById('pr-search-input');
      if (searchEl) {
        searchEl.addEventListener('input', () => {
          state.prSearch = searchEl.value;
          const pos = searchEl.selectionStart;
          render();
          const newEl = document.getElementById('pr-search-input');
          if (newEl) { newEl.focus(); newEl.setSelectionRange(pos, pos); }
        });
      }
    }

    function openAddExerciseModal(mode, dayIdx, editExIdx) {

      }
      const exName = existing ? existing.name : '';
      const exMuscle = existing ? existing.muscle : 'Chest';
      const exMode = existing ? (existing.mode || (existing.weightKg > 0 ? 'weight_reps' : 'bodyweight')) : 'weight_reps';
      const exSets = existing ? existing.sets : 3;
      const exReps = existing ? existing.reps : 10;
      const exWeight = existing ? dispWeight(existing.weightKg) : 20;
      const exRest = existing ? existing.restSec : 90;
      const exNotes = existing ? (existing.notes || '') : '';
      const standardMuscles = ['Chest', 'Back', 'Legs', 'Shoulders', 'Arms', 'Core', 'Cardio', 'Full Body'];

    function updateStrengthTools() {
      const tEl = document.getElementById('calc-target');
      const bEl = document.getElementById('calc-bar');
      const pRes = document.getElementById('plate-result');
      if (tEl && bEl && pRes) {
        const target = parseFloat(tEl.value) || 0;
        const bar = parseFloat(bEl.value) || 0;
        let perSide = (target - bar) / 2;
        if (perSide <= 0) {
          pRes.innerHTML = `<div class="font-mono text-xs text-[#8A887F]">EMPTY BAR</div>`;
        } else {
          const plates = state.unit === 'lb' ? [45, 35, 25, 10, 5, 2.5] : [25, 20, 15, 10, 5, 2.5, 1.25];
          const used = [];
          plates.forEach((p) => { while (perSide >= p - 0.001) { used.push(p); perSide -= p; } });
          pRes.innerHTML = `
            <div class="font-mono text-[10px] uppercase text-[#8A887F] mb-2">Load Per Side</div>
            <div class="flex flex-wrap gap-1.5">
              ${used.map((p) => `<span class="px-2.5 py-1 rounded-[4px] bg-[#1E1E1B] border border-[#FF4F1F] text-[#F3F2ED] font-mono text-xs font-bold">${p} ${state.unit}</span>`).join('')}
            </div>
            ${perSide > 0.1 ? `<div class="font-mono text-[10px] text-[#E5B53B] mt-1.5">REMAINDER: ${perSide.toFixed(2)} ${state.unit}/SIDE</div>` : ''}
          `;
        }
      }
      const wEl = document.getElementById('rm-weight');
      const rEl = document.getElementById('rm-reps');
      const rmRes = document.getElementById('rm-result');
      if (wEl && rEl && rmRes) {
        const w = parseFloat(wEl.value) || 0;
        const r = Math.max(1, parseInt(rEl.value, 10) || 1);
        const est = r === 1 ? w : Math.round(w * (1 + r / 30) * 10) / 10;
        rmRes.innerHTML = `EST. 1RM: <span class="text-[#E5B53B] text-base font-bold">${est} ${state.unit}</span> <span class="ml-2 text-[#8A887F]">(85% WORK: ${Math.round(est * 0.85)} ${state.unit})</span>`;
      }
    }

    function readExerciseFormValues() {
      const name = (document.getElementById('new-ex-name')?.value || '').trim();
      const muscleSel = document.getElementById('new-ex-muscle')?.value || 'Full Body';
      const customMuscle = (document.getElementById('new-ex-custom-muscle')?.value || '').trim();
      const muscle = muscleSel === '__custom__' ? (customMuscle || 'Custom') : muscleSel;
      const mode = document.getElementById('new-ex-mode')?.value || 'weight_reps';
      const sets = Math.max(1, parseInt(document.getElementById('new-ex-sets')?.value, 10) || 3);
      const reps = Math.max(1, parseInt(document.getElementById('new-ex-reps')?.value, 10) || 10);
      const weightKg = mode === 'bodyweight' ? 0 : toKg(document.getElementById('new-ex-weight')?.value || 0);
      const restSec = Math.max(15, parseInt(document.getElementById('new-ex-rest')?.value, 10) || 90);
      const notes = (document.getElementById('new-ex-notes')?.value || '').trim();
      return { name, muscle, mode, sets, reps, weightKg, restSec, notes };
    }

    // =========================================================================
    // EVENT DELEGATION
    // =========================================================================
    document.addEventListener('click', (e) => {
      const target = e.target.closest('[data-action]');
      if (!target) {
        if (e.target.id === 'modal-overlay') closeModal();
        return;
      }
      const action = target.dataset.action;

      if (action === 'nav') {
        state.activeTab = target.dataset.tab;
        saveState();
        render();
      } else if (action === 'toggle-unit') {
        state.unit = state.unit === 'kg' ? 'lb' : 'kg';
        saveState();
        render();
        showToast(`Weights set to ${state.unit.toUpperCase()}`, 'info');
      } else if (action === 'toggle-sound') {
        state.soundEnabled = !state.soundEnabled;
        saveState();
        render();
        if (state.soundEnabled) playSetCompleteSound();
      } else if (action === 'open-tools-modal') {
        openToolsModal();
      } else if (action === 'close-modal') {
        closeModal();
      } else if (action === 'select-day') {
        state.selectedDayIndex = parseInt(target.dataset.day, 10) || 0;
        saveState();
        render();
      } else if (action === 'start-workout') {
        startWorkoutSession(parseInt(target.dataset.day, 10));
      } else if (action === 'start-scheduled-workout') {
        startWorkoutSession(parseInt(target.dataset.day, 10), target.dataset.planId);
      } else if (action === 'toggle-set') {
        toggleSetDone(parseInt(target.dataset.ex, 10), parseInt(target.dataset.set, 10));
      } else if (action === 'add-session-set') {
        const ex = state.activeSession && state.activeSession.exercises[parseInt(target.dataset.ex, 10)];
        if (ex) {
          const last = ex.sets[ex.sets.length - 1] || { weightKg: 0, reps: 10 };
          ex.sets.push({ id: 'set_' + Date.now(), weightKg: last.weightKg, reps: last.reps, done: false, isPR: false });
          saveState();
          render();
        }
      } else if (action === 'remove-session-set') {
        const ex = state.activeSession && state.activeSession.exercises[parseInt(target.dataset.ex, 10)];
        if (ex && ex.sets.length > 1) { ex.sets.pop(); saveState(); render(); }
      } else if (action === 'toggle-pause-session') {
        if (state.activeSession) { state.activeSession.isPaused = !state.activeSession.isPaused; saveState(); render(); }
      } else if (action === 'discard-session') {
        state.activeSession = null;
        stopSessionTimer();
        stopRestTimer();
        saveState();
        render();
        showToast('Session discarded', 'info');
      } else if (action === 'open-finish-modal') {
        openFinishWorkoutModal();
      } else if (action === 'confirm-finish-workout') {
        commitFinishedWorkout();
      } else if (action === 'start-manual-rest') {
        startRestTimer(parseInt(target.dataset.sec, 10) || 90);
      } else if (action === 'rest-adjust') {
        restSecondsLeft = Math.max(5, restSecondsLeft + (parseInt(target.dataset.delta, 10) || 0));
        restTotalSeconds = Math.max(restTotalSeconds, restSecondsLeft);
        updateRestProgressVisual();
      } else if (action === 'rest-skip') {
        stopRestTimer();
      } else if (action === 'open-add-session-ex') {
        openAddExerciseModal('session', 0);
      } else if (action === 'pick-library-ex') {
        const item = EXERCISE_LIBRARY[parseInt(target.dataset.libIdx, 10)];
        if (!item) return;
        const setVal = (id, v) => { const el = document.getElementById(id); if (el) el.value = v; };
        setVal('new-ex-name', item.name);
        setVal('new-ex-muscle', item.muscle);
        setVal('new-ex-mode', item.mode || 'weight_reps');
        setVal('new-ex-sets', item.sets);
        setVal('new-ex-reps', item.reps);
        setVal('new-ex-weight', dispWeight(item.weightKg));
        setVal('new-ex-rest', item.restSec);
        const lbl = document.getElementById('new-ex-reps-label');
        if (lbl) lbl.textContent = item.mode === 'timed' ? 'Seconds' : 'Reps';
        const customIn = document.getElementById('new-ex-custom-muscle');
        if (customIn) customIn.classList.add('hidden');
      } else if (action === 'confirm-add-session-ex') {
        const vals = readExerciseFormValues();
        if (!vals.name || !state.activeSession) { showToast('Enter an exercise name.', 'error'); return; }
        const sets = Array.from({ length: vals.sets }, (_, i) => ({ id: 'ns_' + Date.now() + '_' + i, weightKg: vals.weightKg, reps: vals.reps, done: false, isPR: false }));
        state.activeSession.exercises.push({ id: 'nex_' + Date.now(), name: vals.name, muscle: vals.muscle, mode: vals.mode, restSec: vals.restSec, notes: vals.notes, sets });
        saveState(); closeModal(); render();
      } else if (action === 'open-create-plan-modal') {
        openCreatePlanModal();
      } else if (action === 'confirm-create-plan') {
        const name = (document.getElementById('cp-name')?.value || '').trim() || 'My Custom Plan';
        const desc = (document.getElementById('cp-desc')?.value || '').trim();
        const count = Math.max(1, parseInt(document.getElementById('cp-days')?.value, 10) || 3);
        const days = Array.from({ length: count }, (_, i) => ({ id: 'cday_' + Date.now() + '_' + i, name: `Day ${i + 1}`, exercises: [] }));
        const newPlan = { id: 'plan_' + Date.now(), name, description: desc || 'Custom workout plan', days };
        state.plans.unshift(newPlan);
        state.activePlanId = newPlan.id;
        state.selectedDayIndex = 0;
        state.customPlansImported = (state.customPlansImported || 0) + 1;
        saveState(); closeModal(); render();
        showToast(`Created "${name}"`, 'success');
      } else if (action === 'open-edit-plan-modal') {
        openEditPlanModal();
      } else if (action === 'confirm-edit-plan') {
        const plan = getActivePlan();
        const name = (document.getElementById('ep-name')?.value || '').trim();
        const desc = (document.getElementById('ep-desc')?.value || '').trim();
        if (plan && name) { plan.name = name; plan.description = desc; saveState(); closeModal(); render(); showToast('Plan updated', 'success'); }
      } else if (action === 'duplicate-plan') {
        const orig = getPlanById(target.dataset.planId);
        if (!orig) return;
        const copy = clone(orig);
        copy.id = 'plan_' + Date.now();
        copy.name = orig.name + ' (Copy)';
        state.plans.unshift(copy);
        state.activePlanId = copy.id;
        state.selectedDayIndex = 0;
        saveState(); render();
        showToast(`Duplicated "${orig.name}"`, 'success');
      } else if (action === 'open-edit-day-modal') {
        openEditDayModal(parseInt(target.dataset.day, 10));
      } else if (action === 'confirm-edit-day') {
        const plan = getActivePlan();
        const dIdx = parseInt(target.dataset.day, 10);
        const name = (document.getElementById('edit-day-name')?.value || '').trim();
        if (plan && plan.days[dIdx] && name) { plan.days[dIdx].name = name; saveState(); closeModal(); render(); }
      } else if (action === 'duplicate-plan-day') {
        const plan = getActivePlan();
        const dIdx = parseInt(target.dataset.day, 10);
        if (plan && plan.days[dIdx]) {
          const copy = clone(plan.days[dIdx]);
          copy.id = 'day_' + Date.now();
          copy.name = copy.name + ' (Copy)';
          plan.days.splice(dIdx + 1, 0, copy);
          saveState(); render();
        }
      } else if (action === 'move-plan-day') {
        const plan = getActivePlan();
        const dIdx = parseInt(target.dataset.day, 10);
        const newIdx = dIdx + parseInt(target.dataset.dir, 10);
        if (plan && newIdx >= 0 && newIdx < plan.days.length) {
          const tmp = plan.days[dIdx]; plan.days[dIdx] = plan.days[newIdx]; plan.days[newIdx] = tmp;
          saveState(); render();
        }
      } else if (action === 'open-edit-plan-ex') {
        openAddExerciseModal('edit-plan', parseInt(target.dataset.day, 10), parseInt(target.dataset.ex, 10));
      } else if (action === 'confirm-edit-plan-ex') {
        const plan = getActivePlan();
        const dIdx = parseInt(target.dataset.day, 10);
        const eIdx = parseInt(target.dataset.ex, 10);
        const vals = readExerciseFormValues();
        if (!vals.name || !plan || !plan.days[dIdx] || !plan.days[dIdx].exercises[eIdx]) { showToast('Enter an exercise name.', 'error'); return; }
        plan.days[dIdx].exercises[eIdx] = { ...plan.days[dIdx].exercises[eIdx], ...vals };
        saveState(); closeModal(); render();
        showToast('Exercise updated', 'success');
      } else if (action === 'duplicate-plan-ex') {
        const plan = getActivePlan();
        const dIdx = parseInt(target.dataset.day, 10);
        const eIdx = parseInt(target.dataset.ex, 10);
        if (plan && plan.days[dIdx] && plan.days[dIdx].exercises[eIdx]) {
          const copy = clone(plan.days[dIdx].exercises[eIdx]);
          copy.id = 'pex_' + Date.now();
          plan.days[dIdx].exercises.splice(eIdx + 1, 0, copy);
          saveState(); render();
        }
      } else if (action === 'move-plan-ex') {
        const plan = getActivePlan();
        const dIdx = parseInt(target.dataset.day, 10);
        const eIdx = parseInt(target.dataset.ex, 10);
        const list = plan && plan.days[dIdx] && plan.days[dIdx].exercises;
        const newIdx = eIdx + parseInt(target.dataset.dir, 10);
        if (list && newIdx >= 0 && newIdx < list.length) {
          const tmp = list[eIdx]; list[eIdx] = list[newIdx]; list[newIdx] = tmp;
          saveState(); render();
        }
      } else if (action === 'set-schedule-mode') {
        state.schedule.mode = target.dataset.mode || 'single';
        saveState(); render();
      } else if (action === 'flip-rotation-week') {
        state.schedule.rotationOffset = state.schedule.rotationOffset ? 0 : 1;
        saveState(); render();
        showToast(`Active week switched to Week ${getCurrentRotationSlot()}`, 'info');
      } else if (action === 'sync-reminders-to-schedule') {
        const mappedDays = Object.entries(state.schedule.weekdayMap || {}).filter(([, val]) => val && val.planId).map(([dow]) => parseInt(dow, 10)).sort();
        state.reminders.daysOfWeek = mappedDays;
        saveState(); render();
        showToast(`Synced ${mappedDays.length} reminder day(s)`, 'success');
      } else if (action === 'open-import-modal') {
        openImportModal();
      } else if (action === 'fill-sample-csv') {
        const ta = document.getElementById('imp-raw-text');
        const nameIn = document.getElementById('imp-plan-name');
        if (ta) ta.value = `Day,Exercise,Muscle,Sets,Reps,Weight,RestSec\nUpper Strength,Incline Barbell Press,Chest,4,8,65,120\nUpper Strength,Weighted Chin-Ups,Back,4,8,10,120\nLower Strength,Front Squat,Legs,4,6,75,150\nLower Strength,Romanian Deadlift,Legs,3,10,80,120`;
        if (nameIn && !nameIn.value) nameIn.value = 'Custom Strength Block';
      } else if (action === 'copy-csv-template') {
        copyTextToClipboard(`Day,Exercise,Muscle,Sets,Reps,Weight,RestSec\nDay 1,Bench Press,Chest,4,8,70,120\nDay 1,Pull-Ups,Back,3,10,0,90`, 'CSV template');
      } else if (action === 'submit-import-plan') {
        const raw = document.getElementById('imp-raw-text')?.value || '';
        const name = (document.getElementById('imp-plan-name')?.value || '').trim();
        const errBox = document.getElementById('imp-error');
        try {
          const newPlan = parseCustomPlan(raw, name);
          state.plans.unshift(newPlan);
          state.activePlanId = newPlan.id;
          state.selectedDayIndex = 0;
          state.customPlansImported = (state.customPlansImported || 0) + 1;
          saveState(); closeModal(); render();
          showToast(`Imported "${newPlan.name}"`, 'success');
        } catch (err) {
          if (errBox) { errBox.textContent = err.message; errBox.classList.remove('hidden'); }
        }
      } else if (action === 'export-active-plan') {
        const p = getActivePlan();
        if (p) {
          downloadFile(`${p.name.toLowerCase().replace(/[^a-z0-9]+/g, '-')}.json`, JSON.stringify(p, null, 2), 'application/json');
          showToast('Active plan exported as JSON', 'success');
        }
      } else if (action === 'activate-plan') {
        state.activePlanId = target.dataset.planId;
        state.selectedDayIndex = 0;
        saveState(); render();
      } else if (action === 'delete-plan') {
        const pid = target.dataset.planId;
        if (state.plans.length <= 1) return;
        state.plans = state.plans.filter((p) => p.id !== pid);
        if (state.activePlanId === pid) state.activePlanId = state.plans[0].id;
        Object.keys(state.schedule.weekdayMap || {}).forEach((dow) => {
          if (state.schedule.weekdayMap[dow] && state.schedule.weekdayMap[dow].planId === pid) state.schedule.weekdayMap[dow] = null;
        });
        state.selectedDayIndex = 0;
        saveState(); render();
      } else if (action === 'add-preset-plan') {
        const preset = PRESET_PLANS[target.dataset.preset];
        if (!preset) return;
        const copy = clone(preset);
        copy.id = 'plan_' + Date.now();
        state.plans.unshift(copy);
        state.activePlanId = copy.id;
        state.selectedDayIndex = 0;
        saveState(); render();
        showToast(`Added "${copy.name}"`, 'success');
      } else if (action === 'open-add-plan-day') {
        openAddDayModal();
      } else if (action === 'confirm-add-plan-day') {
        const name = (document.getElementById('new-day-name')?.value || '').trim();
        const plan = getActivePlan();
        if (!name || !plan) return;
        plan.days.push({ id: 'day_' + Date.now(), name, exercises: [] });
        saveState(); closeModal(); render();
      } else if (action === 'delete-plan-day') {
        const plan = getActivePlan();
        const idx = parseInt(target.dataset.day, 10);
        if (plan && plan.days.length > 1) { plan.days.splice(idx, 1); state.selectedDayIndex = 0; saveState(); render(); }
      } else if (action === 'open-add-plan-ex') {
        openAddExerciseModal('plan', parseInt(target.dataset.day, 10));
      } else if (action === 'confirm-add-plan-ex') {
        const plan = getActivePlan();
        const dIdx = parseInt(target.dataset.day, 10) || 0;
        const vals = readExerciseFormValues();
        if (!plan || !plan.days[dIdx] || !vals.name) { showToast('Enter an exercise name.', 'error'); return; }
        plan.days[dIdx].exercises.push({ id: 'pex_' + Date.now(), ...vals });
        saveState(); closeModal(); render();
        showToast(`Added ${vals.name}`, 'success');
      } else if (action === 'delete-plan-ex') {
        const plan = getActivePlan();
        const dIdx = parseInt(target.dataset.day, 10);
        const eIdx = parseInt(target.dataset.ex, 10);
        if (plan && plan.days[dIdx]) { plan.days[dIdx].exercises.splice(eIdx, 1); saveState(); render(); }
      } else if (action === 'load-demo-history') {
        loadSampleHistory();
      } else if (action === 'export-all-data') {
        downloadFile('ironpulse-backup.json', JSON.stringify(state, null, 2), 'application/json');
        showToast('Full workout backup downloaded', 'success');
      } else if (action === 'log-bodyweight') {
        const inp = document.getElementById('bw-input');
        const val = parseFloat(inp ? inp.value : '');
        if (!val || val <= 0) { showToast('Enter a valid bodyweight.', 'error'); return; }
        state.bodyWeights.push({ dateISO: new Date().toISOString(), weightKg: toKg(val) });
        saveState(); render();
        showToast('Bodyweight logged', 'success');
      } else if (action === 'delete-history') {
        state.history = state.history.filter((h) => h.id !== target.dataset.id);
        saveState(); render();
        showToast('Session removed', 'info');
      } else if (action === 'toggle-reminders-enabled') {
        state.reminders.enabled = !state.reminders.enabled;
        saveState(); render();
      } else if (action === 'toggle-reminder-day') {
        const dow = parseInt(target.dataset.dow, 10);
        const arr = state.reminders.daysOfWeek || [];
        state.reminders.daysOfWeek = arr.includes(dow) ? arr.filter((d) => d !== dow) : [...arr, dow].sort();
        saveState(); render();
      } else if (action === 'test-reminder') {
        const sched = getScheduledWorkoutForToday();
        triggerReminderAlert(`Scheduled Workout (${state.reminders.time})`, `${sched.day ? sched.day.name : 'Your Workout'} · ${sched.plan.name}`);
      } else if (action === 'add-google-calendar') {
        const days = state.reminders.daysOfWeek || [];
        if (!days.length) {
          showToast('Select at least one workout day first.', 'error');
        } else {
          const icsDays = ['SU', 'MO', 'TU', 'WE', 'TH', 'FR', 'SA'];
          const byDay = days.map((d) => icsDays[d]).join(',');
          const [hh, mm] = (state.reminders.time || '18:00').split(':');
          const now = new Date();
          const pad = (n) => String(n).padStart(2, '0');
          const ymd = `${now.getFullYear()}${pad(now.getMonth() + 1)}${pad(now.getDate())}`;
          const startStr = `${ymd}T${pad(hh)}${pad(mm)}00`;
          const endStr = `${ymd}T${pad((parseInt(hh, 10) + 1) % 24)}${pad(mm)}00`;
          const plan = getActivePlan();
          const url = 'https://calendar.google.com/calendar/render?action=TEMPLATE'
            + '&text=' + encodeURIComponent('IronPulse Workout — ' + (plan ? plan.name : 'Training'))
            + '&dates=' + startStr + '/' + endStr
            + '&recur=' + encodeURIComponent('RRULE:FREQ=WEEKLY;BYDAY=' + byDay)
            + '&details=' + encodeURIComponent('Scheduled IronPulse workout session.');
          window.open(url, '_blank', 'noopener');
        }
      } else if (action === 'export-ics') {
        exportReminderICS();
      } else if (action === 'request-notif') {
        try {
          if ('Notification' in window) {
            Notification.requestPermission().then((perm) => {
              render();
              showToast(perm === 'granted' ? 'Browser notifications enabled' : 'Notification permission not granted', perm === 'granted' ? 'success' : 'info');
            });
          }
        } catch (e) {
          showToast('Browser notifications unavailable; in-app alerts remain active.', 'info');
        }
      } else if (action === 'reminder-start-now') {
        const banner = document.getElementById('reminder-banner');
        if (banner) banner.classList.add('hidden');
        const sched = getScheduledWorkoutForToday();
        startWorkoutSession(sched.dayIndex, sched.plan ? sched.plan.id : null);
      } else if (action === 'reminder-snooze') {
        const banner = document.getElementById('reminder-banner');
        if (banner) banner.classList.add('hidden');
        state.reminders.snoozeUntilMs = Date.now() + 10 * 60000;
        saveState();
        showToast('Snoozed 10 minutes', 'info');
      } else if (action === 'reminder-dismiss') {
        const banner = document.getElementById('reminder-banner');
        if (banner) banner.classList.add('hidden');
      }
    });

    document.addEventListener('change', (e) => {
      const el = e.target;
      if (el.dataset && el.dataset.action === 'toggle-auto-rest') {
        state.autoRestTimer = !!el.checked;
        saveState();
      } else if (el.dataset && el.dataset.scheduleDay != null) {
        const dow = parseInt(el.dataset.scheduleDay, 10);
        const val = el.value;
        if (val === 'REST') state.schedule.weekdayMap[dow] = null;
        else {
          const [planId, dayStr] = val.split('::');
          state.schedule.weekdayMap[dow] = { planId, dayIndex: parseInt(dayStr, 10) || 0 };
        }
        saveState(); render();
      } else if (el.id === 'rot-week-a') {
        state.schedule.weekAPlanId = el.value;
        saveState(); render();
      } else if (el.id === 'rot-week-b') {
        state.schedule.weekBPlanId = el.value;
        saveState(); render();
      } else if (el.id === 'rem-time-input') {
        state.reminders.time = el.value || '18:00';
        state.reminders.lastTriggeredKey = '';
        saveState(); render();
      } else if (el.id === 'rem-lead-select') {
        state.reminders.leadMinutes = parseInt(el.value, 10) || 0;
        state.reminders.lastTriggeredKey = '';
        saveState(); render();
      }
    });

    document.addEventListener('input', (e) => {
      const el = e.target;
      if (!el.dataset || !el.dataset.input || !state.activeSession) return;
      const exIdx = parseInt(el.dataset.ex, 10);
      const setIdx = parseInt(el.dataset.set, 10);
      const ex = state.activeSession.exercises[exIdx];
      if (!ex || !ex.sets[setIdx]) return;
      if (el.dataset.input === 'set-weight') ex.sets[setIdx].weightKg = toKg(el.value);
      else if (el.dataset.input === 'set-reps') ex.sets[setIdx].reps = Math.max(0, parseInt(el.value, 10) || 0);
      saveState();
    });

    // =========================================================================
    // INIT
    // =========================================================================
    if (state.activeSession) startSessionTimer();
    render();
    startClockLoop();
    if ('serviceWorker' in navigator && window.location.protocol !== 'file:') {
      window.addEventListener('load', () => { navigator.serviceWorker.register('./sw.js').catch(() => {}); });
    }
  })();
  </script>
</body>
</html>
